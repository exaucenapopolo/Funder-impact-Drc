<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation - Founder Impact Awards RDC</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #0a0a0a;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        .logo {
            margin-bottom: 2rem;
        }
        .logo img {
            height: 100px;
            filter: drop-shadow(0 0 20px gold);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #FFD700;
            margin-bottom: 1rem;
        }
        p {
            color: #C0C0C0;
            font-size: 1.2rem;
            margin-bottom: 2rem;
            max-width: 600px;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: #FFD700;
            color: #0a0a0a;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        .btn:hover {
            background: transparent;
            color: #FFD700;
            box-shadow: 0 0 20px gold;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="https://raw.githubusercontent.com/exaucenapopolo/Funder-impact-Drc/refs/heads/main/IMG-20260314-WA0050.jpg" alt="Logo">
    </div>
    <h1>Merci pour votre inscription !</h1>
    <p>Votre candidature a bien été enregistrée. Nous vous contacterons par email pour la suite du processus. Vous pouvez maintenant partager votre profil pour recueillir des votes.</p>
    <a href="index.html" class="btn">Retour à l'accueil</a>
</body>
</html>
