<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation - Founder Impact Awards RDC</title>
    <style>
        /* Styles simplifiés */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .logo {
            margin-bottom: 2rem;
        }
        .logo img {
            height: 100px;
            filter: drop-shadow(0 0 10px gold);
        }
        h1 {
            color: #FFD700;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            color: #C0C0C0;
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: #FFD700;
            color: #0a0a0a;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover {
            background: transparent;
            color: #FFD700;
            box-shadow: 0 0 20px gold;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="https://raw.githubusercontent.com/exaucenapopolo/Funder-impact-Drc/refs/heads/main/IMG-20260314-WA0050.jpg" alt="Logo">
    </div>
    <h1>Merci pour votre inscription !</h1>
    <p>Votre candidature a bien été enregistrée. Nous vous contacterons par email pour la suite du processus.</p>
    <a href="index.html" class="btn">Retour à l'accueil</a>
</body>
</html>
